name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - run: pnpm lint

      - run: pnpm format:check

      # A package that builds but ships the wrong files is otherwise only caught at
      # `npm install` time. `pnpm pack` resolves the `files` allowlist exactly as npm would.
      - name: Verify publishable contents
        run: pnpm pack --pack-destination /tmp/pack
