name: Release

# Publishing is driven by a version tag, not by a merge. `npm version patch` writes the
# package.json bump and the matching tag in one step, so the two can never disagree:
#
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets npm attach a provenance attestation, proving the tarball was built from this commit
  # in this workflow rather than uploaded from someone's laptop.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # A tag that disagrees with package.json publishes a version nobody can find the source
      # for. npm versions are permanent, so this is checked before the publish, not after.
      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
