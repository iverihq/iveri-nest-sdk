name: Release

# Publishing is driven by a version tag, not by a merge. The version bump lands in the PR; after
# it merges, the merge commit is tagged and that one tag is pushed:
#
#   git tag -a v0.25.0 -m v0.25.0 && git push origin v0.25.0
#
# Never `--follow-tags`: it also pushes every older local tag that was never pushed, which
# publishes versions nobody meant to release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The OIDC token npm trusts in place of a stored secret, and the provenance attestation proving
  # the tarball was built from this commit in this workflow rather than uploaded from a laptop.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # A tag that disagrees with package.json publishes a version nobody can find the source
      # for. npm versions are permanent, so this is checked before the publish, not after.
      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # Trusted publishing: npm exchanges this workflow's OIDC token (the `id-token: write`
      # permission above) for a short-lived publish credential, so no long-lived npm token exists
      # to leak, expire or be refused. Each package's npmjs.com settings name this repository and
      # `release.yml` as its trusted publisher. Provenance is attached automatically.
      - run: npm publish --access public
